openapi: 3.0.3
info:
  title: Mini Op ERP API
  version: "1.0.0"
  description: >
    Backend API for the Mini Operations ERP case study. Covers inventory,
    work orders, internal stock transfers, and customer order reservation.
    Served interactively at GET /docs when the backend is running.
servers:
  - url: http://localhost:4010/api
    description: Local development

security:
  - bearerAuth: []

tags:
  - name: Auth
  - name: Reference Data
  - name: Inventory
  - name: Work Orders
  - name: Transfers
  - name: Orders

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Log in and receive a JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Login succeeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { $ref: "#/components/schemas/User" }
        "401":
          description: Invalid credentials

  /auth/me:
    get:
      tags: [Auth]
      summary: Get the current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { description: Missing or invalid token }

  /locations:
    get:
      tags: [Reference Data]
      summary: List locations
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Location" }
    post:
      tags: [Reference Data]
      summary: Create a location (Admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, code]
              properties:
                name: { type: string }
                code: { type: string }
      responses:
        "201": { description: Created }
        "403": { description: Forbidden - requires ADMIN }

  /categories:
    get:
      tags: [Reference Data]
      summary: List categories
      responses:
        "200": { description: OK }
    post:
      tags: [Reference Data]
      summary: Create a category (Admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "201": { description: Created }
        "403": { description: Forbidden - requires ADMIN }

  /items:
    get:
      tags: [Reference Data]
      summary: List items
      responses:
        "200": { description: OK }
    post:
      tags: [Reference Data]
      summary: Create an item (Admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sku, name, categoryId]
              properties:
                sku: { type: string }
                name: { type: string }
                categoryId: { type: string, format: uuid }
      responses:
        "201": { description: Created }
        "403": { description: Forbidden - requires ADMIN }

  /users:
    get:
      tags: [Reference Data]
      summary: List users (Admin only - used to populate "assign to" pickers)
      responses:
        "200": { description: OK }
        "403": { description: Forbidden - requires ADMIN }

  /inventory:
    get:
      tags: [Inventory]
      summary: List all inventory records with computed availableQuantity
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/InventoryRecord" }
    post:
      tags: [Inventory]
      summary: Create a new inventory record (Admin, Operations)
      description: >
        Creates a new item+location+batch record with an initial physical quantity.
        Fails with 409 if a record already exists for that item/location/batch, or if
        idempotencyKey has already been used.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemId, locationId, batch, physicalQuantity, idempotencyKey]
              properties:
                itemId: { type: string, format: uuid }
                locationId: { type: string, format: uuid }
                batch: { type: string }
                physicalQuantity: { type: integer, minimum: 1 }
                idempotencyKey: { type: string }
      responses:
        "201": { description: Created }
        "409": { description: Duplicate record or duplicate idempotency key }
        "403": { description: Forbidden - requires ADMIN or OPERATIONS }

  /inventory/{id}/adjust:
    post:
      tags: [Inventory]
      summary: Adjust physical quantity by a signed delta (Admin, Operations)
      description: >
        Atomic conditional update - fails with 409 if the result would be negative
        or would drop physicalQuantity below reservedQuantity. Also fails with 409 on
        a reused idempotencyKey.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [delta, idempotencyKey]
              properties:
                delta: { type: integer, description: "Positive or negative, non-zero" }
                idempotencyKey: { type: string }
      responses:
        "200": { description: Updated }
        "409": { description: Invalid resulting quantity or duplicate idempotency key }
        "403": { description: Forbidden - requires ADMIN or OPERATIONS }

  /work-orders:
    get:
      tags: [Work Orders]
      summary: List work orders
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkOrder" }
    post:
      tags: [Work Orders]
      summary: Create a work order (Admin only)
      description: >
        shortageQuantity is auto-calculated as
        max(0, requiredQuantity - availableQuantityAtLocation).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locationId, itemId, requiredQuantity, assignedUserId]
              properties:
                locationId: { type: string, format: uuid }
                itemId: { type: string, format: uuid }
                requiredQuantity: { type: integer, minimum: 1 }
                assignedUserId: { type: string, format: uuid }
      responses:
        "201": { description: Created }
        "403": { description: Forbidden - requires ADMIN }

  /work-orders/{id}/status:
    patch:
      tags: [Work Orders]
      summary: Advance work order status (Admin, or the assigned Operations user)
      description: >
        Only forward transitions are allowed: ASSIGNED -> IN_PROGRESS -> COMPLETED.
        An Operations User may only update a work order assigned to them.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [ASSIGNED, IN_PROGRESS, COMPLETED] }
      responses:
        "200": { description: Updated }
        "400": { description: Invalid status transition }
        "403": { description: Forbidden }

  /transfers:
    get:
      tags: [Transfers]
      summary: List internal transfers
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Transfer" }
    post:
      tags: [Transfers]
      summary: Request an internal transfer (Admin, Operations)
      description: Creates the transfer in REQUESTED status. No inventory changes yet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceLocationId, destinationLocationId, itemId, batch, quantity]
              properties:
                sourceLocationId: { type: string, format: uuid }
                destinationLocationId: { type: string, format: uuid }
                itemId: { type: string, format: uuid }
                batch: { type: string }
                quantity: { type: integer, minimum: 1 }
      responses:
        "201": { description: Created }
        "400": { description: Source and destination must differ }
        "403": { description: Forbidden - requires ADMIN or OPERATIONS }

  /transfers/{id}/dispatch:
    post:
      tags: [Transfers]
      summary: Dispatch a transfer (Admin, Operations)
      description: >
        REQUESTED -> DISPATCHED. Reduces source inventory immediately, inside the
        same DB transaction as the status change. Fails with 409 if the transfer is
        not in REQUESTED status, or if available quantity at the source is
        insufficient.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Dispatched }
        "409": { description: Wrong status or insufficient available inventory }
        "403": { description: Forbidden - requires ADMIN or OPERATIONS }

  /transfers/{id}/receive:
    post:
      tags: [Transfers]
      summary: Receive a transfer (Admin, Operations)
      description: >
        DISPATCHED -> RECEIVED. Credits destination inventory (creating the
        item+location+batch record if it doesn't exist yet). Guarded so the same
        transfer can never be received twice - a second call returns 409.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Received }
        "409": { description: Transfer not in DISPATCHED status (already received, or not yet dispatched) }
        "403": { description: Forbidden - requires ADMIN or OPERATIONS }

  /orders:
    get:
      tags: [Orders]
      summary: List customer orders
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CustomerOrder" }
    post:
      tags: [Orders]
      summary: Create a customer order and reserve stock (Sales, Admin)
      description: >
        Reserves quantity against one specific inventory record (item + location +
        batch) using an atomic conditional UPDATE, so two concurrent requests against
        the same row can never both succeed if their combined quantity exceeds what's
        available. Fails with 409 if the requested quantity exceeds available stock.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerName, inventoryRecordId, quantity]
              properties:
                customerName: { type: string }
                inventoryRecordId: { type: string, format: uuid }
                quantity: { type: integer, minimum: 1 }
      responses:
        "201": { description: Created and reserved }
        "409": { description: Cannot reserve more than available inventory }
        "403": { description: Forbidden - requires SALES or ADMIN }

  /orders/{id}/cancel:
    post:
      tags: [Orders]
      summary: Cancel an order and release its reservation (Sales, Admin)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Cancelled, reservation released }
        "409": { description: Already cancelled }
        "403": { description: Forbidden - requires SALES or ADMIN }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        role: { type: string, enum: [ADMIN, OPERATIONS, SALES] }
        locationId: { type: string, format: uuid, nullable: true }

    Location:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }

    InventoryRecord:
      type: object
      properties:
        id: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        locationId: { type: string, format: uuid }
        batch: { type: string }
        physicalQuantity: { type: integer }
        reservedQuantity: { type: integer }
        availableQuantity: { type: integer, description: "Computed: physicalQuantity - reservedQuantity" }

    WorkOrder:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        locationId: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        requiredQuantity: { type: integer }
        assignedUserId: { type: string, format: uuid }
        status: { type: string, enum: [ASSIGNED, IN_PROGRESS, COMPLETED] }
        shortageQuantity: { type: integer }

    Transfer:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        sourceLocationId: { type: string, format: uuid }
        destinationLocationId: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        batch: { type: string }
        quantity: { type: integer }
        status: { type: string, enum: [REQUESTED, DISPATCHED, RECEIVED] }

    CustomerOrder:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        customerName: { type: string }
        status: { type: string, enum: [OPEN, CANCELLED] }
